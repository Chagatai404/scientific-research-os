# Copy this file to research-os.toml and edit it.
# research-os.toml is ignored by git so local paths stay local.

[vault]
path = "C:/Users/<username>/Obsidian/Knowledge"
templates_dir = "90 Templates"
default_session_dir = "00 Tutor Sessions"
research_session_dir = "40 Research/AMS ECAL QML/Sessions"

[install]
claude_skills = "~/.claude/skills"
claude_agents = "~/.claude/agents"
codex_skills = "~/.agents/skills"
codex_agents = "~/.codex/agents"
