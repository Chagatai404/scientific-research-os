# Copy this file to research-os.toml (ignored by git, so local paths stay local) and edit it.
# Records themselves live in $ROS_HOME/projects/<name> (default ~/ResearchOS); set ROS_HOME to move them.

[paper_library]
# The screened local paper library read by `python -m ros.lib.paper_library` and `python -m ros.lib.scout`.
root = "~/Research/papers"
organization = "concept"
max_pdf_bytes = 52428800
