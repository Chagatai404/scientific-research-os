schema_version = 1
id = "geant4"
name = "Geant4"
category = "particle-transport"
[python]
packages = ["geant4_pybind"]
[probe]
commands = [["geant4-config", "--version"]]
environment = ["G4LEDATA", "G4LEVELGAMMADATA", "G4PARTICLEXSDATA", "G4NEUTRONHPDATA", "G4RADIOACTIVEDATA", "G4PIIDATA", "G4REALSURFACEDATA", "G4SAIDXSDATA", "G4ABLADATA", "G4INCLDATA", "G4ENSDFSTATEDATA"]
[provenance]
fields = ["version", "binding_version", "datasets", "compiler", "build", "python_version", "platform"]
