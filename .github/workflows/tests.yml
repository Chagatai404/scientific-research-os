name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Diagnose the headless browser
        continue-on-error: true
        run: |
          which google-chrome chromium chromium-browser xelatex || true
          google-chrome --version || true
          echo '<p>hi</p>' > /tmp/d.html
          google-chrome --headless --disable-gpu --user-data-dir=/tmp/p1 --print-to-pdf=/tmp/d.pdf file:///tmp/d.html 2>&1 | tail -15; ls -la /tmp/d.pdf || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests -p "test_*.py"

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright with Chromium
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: A whole lesson in the browser, layout at 320 to 1920 px
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: node tests/ros-portal-browser.cjs
