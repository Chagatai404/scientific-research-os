name: Desktop release
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm --prefix frontend ci
      - run: npm --prefix desktop ci
      - run: node desktop/node_modules/electron/install.js
      - run: python -m pip install --target .desktop-build/python-packages -r desktop/requirements-build.txt
      - run: npm install --prefix .desktop-build/browser-tools --no-save playwright
      - name: Full verification
        shell: pwsh
        run: |
          $env:ROS_PLAYWRIGHT = Join-Path $pwd '.desktop-build/browser-tools/node_modules/playwright'
          $env:ROS_BROWSER = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          python desktop/verify.py
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix desktop test
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop/build-backend.ps1
      - name: Build installer and updater metadata
        run: npm --prefix desktop run installer
      - name: Verify frozen engines without system Python
        run: python tests/desktop_frozen_smoke.py
      - name: Verify packaged native launch
        run: python tests/desktop_native_smoke.py
      - name: Verify isolated install, launch and uninstall
        run: python tests/desktop_installer_smoke.py
      - name: Verify automatic updater download and integrity rejection
        run: |
          python tests/desktop_updater_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/desktop_updater_smoke.py --corrupt
      - uses: actions/upload-artifact@v4
        with:
          name: Research-OS-Windows-Installer
          path: |
            desktop/dist/Research-OS-Setup-*.exe
            desktop/dist/Research-OS-Setup-*.exe.blockmap
            desktop/dist/latest.yml
      - name: Publish explicitly tagged desktop release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $expected = 'desktop-v' + (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ($tag -ne $expected) { throw 'Tag must match desktop/package.json version' }
          gh release create $tag desktop/dist/Research-OS-Setup-*.exe desktop/dist/Research-OS-Setup-*.exe.blockmap desktop/dist/latest.yml --title "Research OS $tag" --generate-notes
